# Construit RemontadaPlanner.exe sur Windows et publie la Release GitHub.
# Deux façons de le lancer : pousser un tag (ex. v1.1.0), ou cliquer sur
# "Run workflow" dans l'onglet Actions (le tag est alors créé à partir de
# APP_VERSION). Rien à builder en local.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Détermine la version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path app.pyw -Pattern '^APP_VERSION = "(.+)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            $tag = "$env:GITHUB_REF_NAME"
            if ($tag.TrimStart('v') -ne $ver) { Write-Error "APP_VERSION ($ver) ne correspond pas au tag ($tag)"; exit 1 }
          } else {
            $tag = "v$ver"
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { Write-Error "La release $tag existe déjà : augmente APP_VERSION"; exit 1 }
            $global:LASTEXITCODE = 0
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Installe les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller

      - name: Vérifie la syntaxe
        run: python -m py_compile app.pyw

      - name: Construit l'exe
        run: pyinstaller --noconfirm RemontadaPlanner.spec

      - name: Prépare le zip
        shell: pwsh
        run: |
          if (-not (Test-Path dist\RemontadaPlanner.exe)) { Write-Error "exe manquant"; exit 1 }
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist\RemontadaPlanner.exe pkg\
          Copy-Item packaging\LISEZMOI.txt pkg\
          Compress-Archive -Path pkg\* -DestinationPath RemontadaPlanner.zip -Force

      - name: Publie la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "packaging\notes\$env:RELEASE_TAG.md"
          if (-not (Test-Path $notes)) { $notes = "packaging\notes\default.md" }
          gh release create "$env:RELEASE_TAG" RemontadaPlanner.zip --target "$env:GITHUB_SHA" `
            --title "Remontada Planner $env:RELEASE_TAG" --notes-file $notes
